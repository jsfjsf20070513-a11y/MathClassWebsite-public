    <style>
      /* 启动纸面(2026-08 杂志刊):刷新时不再放旧站扫描条加载页,
         直接铺封面纸色 + 花体刊名极淡浮现——React 一挂载即被杂志盖上。 */
      :root {
        --boot-paper: #f4efe6;
        --boot-wine: #7d2f28;
      }

      html,
      body {
        min-height: 100%;
        background: var(--boot-paper);
      }

      body {
        margin: 0;
        min-width: 320px;
      }

      #root {
        min-height: 100vh;
        min-height: 100svh;
      }

      .boot-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-paper);
      }

      .boot-mark {
        margin: 0;
        font-family: "Pinyon Script", cursive;
        font-size: 52px;
        line-height: 1.2;
        color: var(--boot-wine);
        opacity: 0;
        /* 0.5s 后才浮现:秒开时观众根本看不到加载态,慢网才见刊名 */
        animation: boot-in 0.9s 0.5s ease forwards;
      }

      @keyframes boot-in {
        to { opacity: 0.85; }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-mark { animation: none; opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-overlay">
        <p class="boot-mark" role="status" aria-label="Chargement">Math</p>
