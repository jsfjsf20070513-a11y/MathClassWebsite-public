    <style>
      /* 启动骨架:与 React 侧 PageLoading(pl-*)同一视觉语言的静态复刻——
         纸底、居中等宽小字、2px 发丝扫描线。无光晕、无渐变、无卡片。 */
      :root {
        --boot-paper: #fdfcf8;
        --boot-ink: #221d18;
        --boot-muted: #6f675e;
        --boot-accent: #7f302b;
        --boot-rule: rgba(34, 29, 24, 0.16);
      }

      html,
      body {
        min-height: 100%;
        background: var(--boot-paper);
      }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--boot-ink);
      }

      #root {
        min-height: 100vh;
      }

      .boot-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-paper);
      }

      .boot-shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
      }

      .boot-eyebrow {
        margin: 0;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--boot-accent);
      }

      .boot-track {
        position: relative;
        width: 140px;
        height: 2px;
        background: rgba(26, 26, 26, 0.1);
        overflow: hidden;
      }

      .boot-sweep {
        position: absolute;
        top: 0;
        left: 0;
        height: 2px;
        width: 30%;
        background: var(--boot-accent);
        animation: boot-sweep 1.2s ease-in-out infinite;
      }

      @keyframes boot-sweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(320%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-sweep { animation: none; width: 100%; opacity: 0.35; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-overlay">
        <div class="boot-shell" role="status" aria-live="polite" aria-busy="true">
          <p class="boot-eyebrow">Carnet de classe</p>
          <span class="boot-track" aria-hidden="true"><span class="boot-sweep"></span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
