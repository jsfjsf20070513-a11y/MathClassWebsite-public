<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+SC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; background:#fdfcf8; }
    a{ color:inherit; transition:color .15s ease, border-color .15s ease; }
    p{ text-wrap:pretty; }
    input.vt, textarea.vt, select.vt{ font-family:'EB Garamond',serif; }
    input.vt:focus, textarea.vt:focus, select.vt:focus{ outline:none; }
    input.vt::placeholder, textarea.vt::placeholder{ color:rgba(26,26,26,.3); font-style:italic; }
  </style>
</helmet>

<div style="min-height:100vh; background:#fdfcf8; color:#1a1a1a; font-family:'EB Garamond','Noto Serif SC',serif; font-size:17px; line-height:1.6;">

  <header style="border-bottom:1px solid rgba(26,26,26,.14);">
    <div style="max-width:920px; margin:0 auto; padding:20px 24px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;">
        <a href="#" onClick="{{ noop }}" style="border-bottom:none; color:#1a1a1a; font-family:'EB Garamond',serif; font-size:13px; letter-spacing:.24em; text-transform:uppercase; text-decoration:none; white-space:nowrap;" style-hover="{ color:'#8b0000' }">Carnet de classe</a>
        <a href="#" onClick="{{ noop }}" style="font-size:14px; color:#6b6b6b; text-decoration:none; border-bottom:1px solid rgba(26,26,26,.2); white-space:nowrap;" style-hover="{ color:'#1a1a1a' }">← Atelier · 协作</a>
      </div>
    </div>
  </header>

  <main style="max-width:560px; margin:0 auto; padding:72px 24px 32px;">

    <sc-if value="{{ showPreview }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex; align-items:center; gap:16px; padding-bottom:18px; margin-bottom:8px; border-bottom:1px solid rgba(26,26,26,.14); flex-wrap:wrap;">
        <span style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#6b6b6b;">aperçu</span>
        <sc-for list="{{ stateTabs }}" as="t" hint-placeholder-count="3">
          <button onClick="{{ t.on }}" style="{{ t.style }}" style-hover="{ color:'#1a1a1a' }">{{ t.label }}</button>
        </sc-for>
      </div>
    </sc-if>

    <header style="text-align:center;">
      <p style="margin:0 0 10px; color:#8b0000; font-size:14px; letter-spacing:.12em; text-transform:uppercase;">Curation de ressources</p>
      <h1 style="margin:0; font-family:'Noto Serif SC','Source Han Serif SC',serif; font-size:34px; font-weight:500;">推荐一条资源</h1>
      <p style="margin:14px auto 0; max-width:32rem; color:#6b6b6b; font-size:16px;">推荐一条书目或课程链接,审阅后并入「资源」页的公开书架。</p>
    </header>

    <!-- form -->
    <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:40px; display:flex; flex-direction:column; gap:28px;">
        <label style="display:block;">
          <span style="display:block; margin-bottom:8px; color:#6b6b6b; font-size:14px;">标题 · Titre</span>
          <input class="vt" type="text" placeholder="例:MIT OCW — Linear Algebra" style="width:100%; padding:9px 0; border:none; border-bottom:1px solid rgba(26,26,26,.3); background:transparent; font-size:18px; color:#1a1a1a;" style-focus="{ borderBottomColor:'#8b0000' }">
        </label>
        <label style="display:block;">
          <span style="display:block; margin-bottom:8px; color:#6b6b6b; font-size:14px;">链接 · Lien</span>
          <input class="vt" type="url" placeholder="https://…" style="width:100%; padding:9px 0; border:none; border-bottom:1px solid rgba(26,26,26,.3); background:transparent; font-size:18px; color:#1a1a1a;" style-focus="{ borderBottomColor:'#8b0000' }">
        </label>
        <label style="display:block;">
          <span style="display:block; margin-bottom:8px; color:#6b6b6b; font-size:14px;">归入书架 · Rayon</span>
          <select class="vt" style="width:100%; padding:9px 0; border:none; border-bottom:1px solid rgba(26,26,26,.3); background:transparent; font-size:18px; color:#1a1a1a;" style-focus="{ borderBottomColor:'#8b0000' }">
            <sc-for list="{{ shelves }}" as="s" hint-placeholder-count="8">
              <option>{{ s }}</option>
            </sc-for>
          </select>
        </label>
        <label style="display:block;">
          <span style="display:block; margin-bottom:8px; color:#6b6b6b; font-size:14px;">推荐理由 · Pourquoi</span>
          <textarea class="vt" rows="3" placeholder="一句话说明它好在哪、适合谁。" style="width:100%; padding:9px 0; border:none; border-bottom:1px solid rgba(26,26,26,.3); background:transparent; font-size:18px; color:#1a1a1a; resize:vertical; line-height:1.6;" style-focus="{ borderBottomColor:'#8b0000' }"></textarea>
        </label>

        <div style="display:flex; align-items:baseline; gap:24px; flex-wrap:wrap; margin-top:4px;">
          <button onClick="{{ submit }}" style="padding:0; border:none; border-bottom:1px solid currentColor; background:transparent; color:#8b0000; cursor:pointer; font-family:inherit; font-size:18px;" style-hover="{ color:'#1a1a1a' }">提交待审 · Proposer</button>
          <a href="#" onClick="{{ noop }}" style="color:#6b6b6b; text-decoration:none; border-bottom:1px solid rgba(26,26,26,.2); font-size:16px;" style-hover="{ color:'#1a1a1a', borderBottomColor:'#1a1a1a' }">取消</a>
        </div>
        <p style="margin:2px 0 0; color:#6b6b6b; font-size:13px; font-style:italic;">提交后由管理员审阅;通过后会出现在资源页对应书架。</p>
      </div>
    </sc-if>

    <!-- success -->
    <sc-if value="{{ isDone }}" hint-placeholder-val="">
      <div style="margin-top:48px; padding-top:40px; border-top:1px solid rgba(26,26,26,.14); text-align:center;">
        <p style="margin:0; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#3f7a4e;">✓ 已提交</p>
        <p style="margin:16px auto 0; max-width:30rem; color:#1a1a1a; font-size:17px;">谢谢你的推荐 —— 它已进入待审队列,通过后会并入资源页的书架。</p>
        <div style="margin-top:28px; display:flex; justify-content:center; gap:28px; flex-wrap:wrap;">
          <button onClick="{{ again }}" style="padding:0; border:none; border-bottom:1px solid currentColor; background:transparent; color:#8b0000; cursor:pointer; font-family:inherit; font-size:18px;" style-hover="{ color:'#1a1a1a' }">再推荐一条</button>
          <a href="#" onClick="{{ noop }}" style="color:#6b6b6b; text-decoration:none; border-bottom:1px solid rgba(26,26,26,.2); font-size:18px;" style-hover="{ color:'#1a1a1a', borderBottomColor:'#1a1a1a' }">回到协作</a>
        </div>
      </div>
    </sc-if>

    <!-- logged out -->
    <sc-if value="{{ isLoggedOut }}" hint-placeholder-val="">
      <div style="margin-top:48px; padding-top:40px; border-top:1px solid rgba(26,26,26,.14); text-align:center; color:#6b6b6b;">
        <p style="margin:0 0 14px;">推荐资源需要登录后操作。</p>
        <p style="margin:0;"><a href="#" onClick="{{ noop }}" style="color:#8b0000; text-decoration:none; border-bottom:1px solid currentColor;" style-hover="{ color:'#1a1a1a', borderBottomColor:'#1a1a1a' }">前往登录 →</a></p>
      </div>
    </sc-if>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8b0000&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showStatePreview&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  shelves = [
    'I · 数学分析与证明','II · 高等代数与线性代数','III · 概率、随机过程与数理统计',
    'IV · 法语与双语过渡','V · 法语数学与课程参照','VI · AI、机器学习与计算机视觉',
    'VII · 优化、博弈与相关方法','VIII · 计算、排印与写作'
  ];
  state = { view: 'form' };
  renderVals() {
    const accent = this.props.accentColor ?? '#8b0000';
    const showPreview = this.props.showStatePreview ?? true;
    const v = this.state.view;
    const tabBase = { background:'none', border:'none', padding:0, cursor:'pointer', fontFamily:"'JetBrains Mono', monospace", fontSize:'11px', letterSpacing:'.04em' };
    const keys = [['form','表单'],['done','已提交'],['loggedOut','未登录']];
    const stateTabs = keys.map(([k,label]) => ({ label, on: () => this.setState({ view:k }), style: { ...tabBase, color: v===k?accent:'#6b6b6b', textDecoration: v===k?'underline':'none', textUnderlineOffset:'3px' } }));
    return {
      showPreview, stateTabs, shelves: this.shelves,
      isForm: v==='form', isDone: v==='done', isLoggedOut: v==='loggedOut',
      submit: () => this.setState({ view:'done' }),
      again: () => this.setState({ view:'form' }),
      noop: (e) => { e && e.preventDefault && e.preventDefault(); }
    };
  }
}
</script>
</body>
</html>
