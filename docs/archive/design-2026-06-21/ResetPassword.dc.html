<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+SC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; background:#fdfcf8; }
    a{ color:inherit; transition:color .15s ease, border-color .15s ease; }
    p{ text-wrap:pretty; }
    input.vt{ font-family:'EB Garamond',serif; }
    input.vt:focus{ outline:none; }
  </style>
</helmet>

<div style="min-height:100vh; background:#fdfcf8; color:#1a1a1a; font-family:'EB Garamond','Noto Serif SC',serif; font-size:17px; line-height:1.6;">

  <header style="border-bottom:1px solid rgba(26,26,26,.14);">
    <div style="max-width:920px; margin:0 auto; padding:20px 24px;">
      <a href="#" onClick="{{ noop }}" style="border-bottom:none; color:#1a1a1a; font-family:'EB Garamond',serif; font-size:13px; letter-spacing:.24em; text-transform:uppercase; text-decoration:none; white-space:nowrap;" style-hover="{ color:'#8b0000' }">Carnet de classe</a>
    </div>
  </header>

  <main style="max-width:480px; margin:0 auto; padding:72px 24px 32px;">

    <!-- state preview bar -->
    <sc-if value="{{ showPreview }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex; align-items:center; gap:16px; padding-bottom:18px; margin-bottom:8px; border-bottom:1px solid rgba(26,26,26,.14); flex-wrap:wrap;">
        <span style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#6b6b6b;">aperçu</span>
        <sc-for list="{{ stateTabs }}" as="t" hint-placeholder-count="3">
          <button onClick="{{ t.on }}" style="{{ t.style }}" style-hover="{ color:'#1a1a1a' }">{{ t.label }}</button>
        </sc-for>
      </div>
    </sc-if>

    <header style="text-align:center;">
      <p style="margin:0 0 10px; color:#8b0000; font-size:14px; letter-spacing:.12em; text-transform:uppercase;">Réinitialisation</p>
      <h1 style="margin:0; font-family:'Noto Serif SC','Source Han Serif SC',serif; font-size:34px; font-weight:500;">设置新密码</h1>
      <p style="margin:14px auto 0; max-width:30rem; color:#6b6b6b; font-size:16px;">{{ summary }}</p>
    </header>

    <!-- form -->
    <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:38px; display:flex; flex-direction:column; align-items:center; gap:22px;">
        <label style="display:block; width:300px; text-align:center;">
          <span style="display:block; margin-bottom:7px; color:#6b6b6b; font-size:14px;">新密码 · Nouveau mot de passe</span>
          <input class="vt" type="password" style="width:100%; padding:8px 0; border:none; border-bottom:1px solid rgba(26,26,26,.3); background:transparent; font-size:18px; color:#1a1a1a; text-align:center;" style-focus="{ borderBottomColor:'#8b0000' }">
        </label>
        <label style="display:block; width:300px; text-align:center;">
          <span style="display:block; margin-bottom:7px; color:#6b6b6b; font-size:14px;">确认新密码 · Confirmer</span>
          <input class="vt" type="password" style="width:100%; padding:8px 0; border:none; border-bottom:1px solid rgba(26,26,26,.3); background:transparent; font-size:18px; color:#1a1a1a; text-align:center;" style-focus="{ borderBottomColor:'#8b0000' }">
        </label>
        <p style="margin:4px auto 0; max-width:300px; text-align:center; color:#6b6b6b; font-size:13px;">至少 8 位,建议混合字母与数字。</p>
        <div style="margin-top:6px;">
          <button onClick="{{ submit }}" style="padding:0; border:none; border-bottom:1px solid currentColor; background:transparent; color:#8b0000; cursor:pointer; font-family:inherit; font-size:18px;" style-hover="{ color:'#1a1a1a' }">保存新密码 · Enregistrer</button>
        </div>
      </div>
    </sc-if>

    <!-- success -->
    <sc-if value="{{ isDone }}" hint-placeholder-val="">
      <div style="margin-top:44px; padding-top:40px; border-top:1px solid rgba(26,26,26,.14); text-align:center;">
        <p style="margin:0; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#3f7a4e;">✓ 已更新</p>
        <p style="margin:16px auto 0; max-width:28rem; color:#1a1a1a; font-size:17px;">密码已更新,现在可以用新密码登录了。</p>
        <p style="margin:24px 0 0;"><a href="#" onClick="{{ noop }}" style="color:#8b0000; text-decoration:none; border-bottom:1px solid currentColor; font-size:18px;" style-hover="{ color:'#1a1a1a', borderBottomColor:'#1a1a1a' }">前往登录 · Connexion →</a></p>
      </div>
    </sc-if>

    <!-- expired / invalid link -->
    <sc-if value="{{ isExpired }}" hint-placeholder-val="">
      <div style="margin-top:44px; padding-top:40px; border-top:1px solid rgba(26,26,26,.14); text-align:center; color:#6b6b6b;">
        <p style="margin:0 0 8px; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8b0000;">链接已失效</p>
        <p style="margin:0 auto; max-width:28rem;">这个重置链接已过期或已被使用。请回到登录页重新申请一封重置邮件。</p>
        <p style="margin:24px 0 0;"><a href="#" onClick="{{ noop }}" style="color:#8b0000; text-decoration:none; border-bottom:1px solid currentColor;" style-hover="{ color:'#1a1a1a', borderBottomColor:'#1a1a1a' }">重新申请 · 找回密码 →</a></p>
      </div>
    </sc-if>

    <!-- meditation coda -->
    <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:64px; padding-top:18px; border-top:1px solid rgba(26,26,26,.14); text-align:center;">
        <p style="margin:0 auto; max-width:28rem; font-style:italic; font-size:17px; line-height:1.55; color:#6b6b6b;" lang="fr">Un nouveau mot, et la porte reconnaît de nouveau la main.</p>
        <p style="margin:10px auto 0; max-width:26rem; color:#6b6b6b; font-size:14px;">换一把新钥匙,门便重新认得你的手。</p>
      </div>
    </sc-if>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8b0000&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showStatePreview&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { view: 'form' };
  renderVals() {
    const accent = this.props.accentColor ?? '#8b0000';
    const showPreview = this.props.showStatePreview ?? true;
    const v = this.state.view;
    const tabBase = { background:'none', border:'none', padding:0, cursor:'pointer', fontFamily:"'JetBrains Mono', monospace", fontSize:'11px', letterSpacing:'.04em' };
    const keys = [['form','表单'],['done','成功'],['expired','链接失效']];
    const stateTabs = keys.map(([k,label]) => ({ label, on: () => this.setState({ view:k }), style: { ...tabBase, color: v===k?accent:'#6b6b6b', textDecoration: v===k?'underline':'none', textUnderlineOffset:'3px' } }));
    return {
      showPreview, stateTabs,
      isForm: v==='form', isDone: v==='done', isExpired: v==='expired',
      summary: v==='expired' ? '请重新申请一封重置邮件。' : '为账号设置一个新密码。',
      submit: () => this.setState({ view:'done' }),
      noop: (e) => { e && e.preventDefault && e.preventDefault(); }
    };
  }
}
</script>
</body>
</html>
